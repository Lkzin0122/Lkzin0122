<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Lucas Bitencourt — Desenvolvedor Front-end</title>
  <desc id="desc">Banner em tons de vermelho e laranja. Interfaces com propósito, da web ao mobile. Um editor de código apresenta Lucas, seu foco em front-end e sua stack com React e Flutter.</desc>
