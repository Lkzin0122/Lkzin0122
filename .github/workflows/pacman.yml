# Salve este arquivo em: .github/workflows/pacman.yml
# (dentro do repositório que tem o MESMO NOME do seu usuário do GitHub)

name: generate arcade contribution graphs

on:
  schedule:
    # Roda automaticamente todo dia à meia-noite (UTC)
    - cron: "0 0 * * *"
  # Permite rodar manualmente pela aba Actions
  workflow_dispatch:
  # Roda a cada push na branch principal
  # (se a sua branch padrão for "master", troque aqui)
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: generate contribution graph SVGs
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          # Jogos disponíveis: pacman, breakout, galaga, puzzle-bobble,
          # bomberman, minesweeper. Separe por vírgula para gerar vários.
          games: "pacman"
          # "true" remove a linha de meses acima do gráfico
          hide_month_labels: "false"

      # Publica os SVGs gerados na branch "output"
      - name: push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
